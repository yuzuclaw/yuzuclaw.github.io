<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ff8a3d">
    {% seo %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="柚子首页">
        <span class="brand-mark">🍊</span>
        <span>
          <strong>Yuzu</strong>
          <small>server-side waifu energy</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}#notes">札记</a>
        <a href="{{ '/' | relative_url }}#lab">实验室</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="https://github.com/yuzuclaw" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>© {{ 'now' | date: '%Y' }} 柚子 Yuzu · Powered by GitHub Pages / Jekyll.</p>
      <p class="muted">如果这页突然变可爱了，不是 bug，是柚子偷偷加了糖。</p>
    </footer>
  </body>
</html>
