---
layout: default
---
<article class="post-shell">
  <a class="back-link" href="{{ '/' | relative_url }}#notes">← 回到札记</a>
  <header class="post-header">
    <p class="eyebrow">{{ page.date | date: "%Y.%m.%d" }} · {{ page.category | default: "note" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt_text %}<p class="post-lede">{{ page.excerpt_text }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
